<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <title>WebAR_大野農園</title>
  </head>
  <body>
    <!-- A-Frame の VR空間に AR.js を紐づける -->
    <a-scene vr-mode-ui="enabled: false">
      <a-assets>
        <video
          id="video"
          src="video_AR_Ohno_3.mp4"
        ></video>
        <image
          id="thumbnail"
          src="sumbnail_AR_Ohno.jpg"
        >
        </image>
        <image
          id="kazari1"
          src="Frame_AR_Ohno.png"
        >
        </image>
       
    
      </a-assets>
      　
      <!--マーカー -->
      <a-marker-camera preset="hiro"></a-marker-camera>

        <a-video
          id="arVideo"
          src="#video"
          scale="4 3.5 10"
          position="0 1.8 -10"
          rotation="0 0 0"
          visible="false"
        ></a-video>
        <a-image
          id="thumbnailImg"
          src="#thumbnail"
          scale="4 3.5 10"
          position="0 1.8 -10"
          rotation="0 0 0"
          visible="true"
        >
        </a-image>
        <a-image
          id="kazari1Img"
          src="#kazari1"
          scale="6.2 3 10"
          position="0 1.7 -11"
          rotation="0 0 0"
          visible="true"
        >
        </a-image>
       
     
      <!-- カメラ -->
      <a-entity camera cursor="fuse: false; rayOrigin: mouse;"></a-entity>
    </a-scene>
    <script>
      window.addEventListener("click", () => {
        const video = document.getElementById("video");
        const arVideo = document.getElementById("arVideo");
        const thunbnail = document.getElementById("thumbnailImg");

        thumbnailImg.setAttribute("visible", false);
        arVideo.setAttribute("visible", true);

        video.play();
      });
    </script>
  </body>
</html>
